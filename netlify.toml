[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_PROJECT_ID,SUPABASE_PUBLISHABLE_KEY"

# Proxy Supabase API requests through Netlify to bypass ISP blocks (e.g., Jio)

[[redirects]]
  from = "/api/supabase/*"
  to = "https://clmsoetktmvhazctlans.supabase.co/:splat"
  status = 200
  force = true

# SPA fallback - serve index.html for all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=*"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://ipapi.co https://api.ipify.org https://api.qrserver.com https://accounts.google.com; media-src 'self' blob: https://assets.mixkit.co; frame-src https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
