name: swadeshi_pos
description: "Swadeshi Solutions Native POS & Restaurant Operations Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Backend & Supabase
  supabase_flutter: ^2.8.0
  # Fonts & Icons (1:1 Web match)
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # Offline & Storage
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  # Biometrics & Hardware
  local_auth: ^2.3.0
  audioplayers: ^6.1.0
  mobile_scanner: ^6.0.4
  image_picker: ^1.1.2
  # QR Codes & Charts
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
