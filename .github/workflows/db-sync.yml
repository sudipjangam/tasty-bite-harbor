name: Database Replication (Prod to Dev)

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Replication Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - public_only
          - auth_and_public

jobs:
  replicate:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 16 Client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Sync Database (Prod to Dev)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'full' }}
        run: |
          set -e

          if [ -z "$PROD_DB_URL" ] || [ -z "$DEV_DB_URL" ]; then
            echo "❌ Error: PROD_DB_URL or DEV_DB_URL secrets are not set in GitHub Repository Secrets."
            exit 1
          fi

          echo "🚀 Starting Database Replication (Mode: $SYNC_MODE)..."

          # 1. Dump Public Schema
          echo "📦 1. Dumping 'public' schema from PROD..."
          pg_dump "$PROD_DB_URL" \
            --schema=public \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --quote-all-identifiers \
            -f public_dump.sql

          # 2. Dump Storage Schema
          echo "📦 2. Dumping 'storage' schema from PROD..."
          pg_dump "$PROD_DB_URL" \
            --schema=storage \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            -f storage_dump.sql || echo "⚠️ Warning: Storage dump had non-critical notices"

          # 3. Dump Auth Schema Data (if full or auth_and_public)
          if [ "$SYNC_MODE" != "public_only" ]; then
            echo "📦 3. Dumping 'auth' table data from PROD..."
            pg_dump "$PROD_DB_URL" \
              --schema=auth \
              --data-only \
              --no-owner \
              --no-privileges \
              -f auth_data_dump.sql || echo "⚠️ Warning: Auth data dump had non-critical notices"
          fi

          echo "📥 4. Assembling and executing atomic restore on DEV..."

          # Disable triggers & foreign key checks temporarily during restore to prevent constraint crashes
          cat << 'EOF' > restore_wrapper.sql
          BEGIN;
          SET session_replication_role = 'replica';
          EOF

          cat public_dump.sql >> restore_wrapper.sql

          if [ -f storage_dump.sql ]; then
            cat storage_dump.sql >> restore_wrapper.sql
          fi

          if [ -f auth_data_dump.sql ]; then
            cat auth_data_dump.sql >> restore_wrapper.sql
          fi

          cat << 'EOF' >> restore_wrapper.sql
          SET session_replication_role = 'origin';
          COMMIT;
          EOF

          echo "⚡ Restoring to DEV database..."
          psql "$DEV_DB_URL" -f restore_wrapper.sql

          echo "✅ Database Replication completed successfully!"
